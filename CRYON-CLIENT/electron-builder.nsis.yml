appId: com.cryonclient.launcher
productName: CRYON CLIENT
asar: true
npmRebuild: false
directories:
  output: build-output/installer
files:
  - src/**/*
  - modules/**/*
  - configs/**/*
  - assets/**/*
  - package.json
  - '!tests/**'
  - '!scripts/**'
  - '!modules/mods/nova-hud-fabric/**'
  - '!modules/**/README.md'
  - '!README.md'
  - '!BUILD_STATUS.md'
  - '!TEST_REPORT.md'
extraMetadata:
  main: src/main.js
win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CRYON CLIENT
  uninstallDisplayName: CRYON CLIENT
artifactName: CRYON CLIENT Setup.${ext}
